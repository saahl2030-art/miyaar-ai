<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>معيار</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: system-ui; }
  </style>
</head>

<body class="bg-gray-50">

<div class="max-w-3xl mx-auto mt-10 p-4">

  <div class="bg-white rounded-2xl shadow-lg p-6">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">معيار</h1>
      <button onclick="toggleLang()" class="bg-teal-600 text-white px-4 py-2 rounded-lg">
        English
      </button>
    </div>

    <h2 class="text-xl font-semibold mb-2">أنشئ مشروعك الدراسي بسهولة</h2>
    <p class="text-gray-500 mb-6">اكتب طلبك وسيتم تجهيز كل شيء لك</p>

    <!-- Service -->
    <label class="font-medium">نوع الخدمة</label>
    <select id="service" onchange="calc()" class="w-full p-3 border rounded-lg mb-4">
      <option value="10">تلخيص - 10</option>
      <option value="25">تقرير - 25</option>
      <option value="55">بحث متوسط - 55</option>
      <option value="120">بحث كامل - 120</option>
      <option value="60">عرض تقديمي - 60</option>
    </select>

    <!-- Pages -->
    <label class="font-medium">عدد الصفحات</label>
    <input type="number" id="pages" value="1" oninput="calc()" 
      class="w-full p-3 border rounded-lg mb-4" />

    <!-- Details -->
    <label class="font-medium">تفاصيل المشروع</label>
    <textarea id="details"
      class="w-full p-3 border rounded-lg mb-4"
      placeholder="اكتب طلبك هنا..."></textarea>

    <!-- Price -->
    <div class="bg-teal-50 border border-teal-200 rounded-xl p-4 flex justify-between items-center mb-4">
      <span class="text-gray-600">السعر الإجمالي</span>
      <span id="price" class="text-xl font-bold text-teal-700">10 درهم</span>
    </div>

    <!-- Button -->
    <button onclick="submitProject()" 
      class="w-full bg-teal-600 hover:bg-teal-700 text-white py-3 rounded-xl font-bold">
      إنشاء المشروع
    </button>

  </div>

</div>

<script>
function calc(){
  let base = Number(document.getElementById("service").value);
  let pages = Number(document.getElementById("pages").value);
  let total = base + (pages * 2);
  document.getElementById("price").innerText = total + " درهم";
}

function submitProject(){
  alert("الخطوة القادمة: ربط الذكاء الاصطناعي");
}

function toggleLang(){
  alert("سيتم إضافة الإنجليزية لاحقاً");
}

calc();
</script>

</body>
</html>
